events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # React SPA — all unmatched paths serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy /api/crm/* → backend (strip /api/crm prefix)
        location /api/crm/ {
            proxy_pass http://lynxmsp-backend:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy /api/netbox/* → NetBox internal (strip /api/netbox prefix)
        location /api/netbox/ {
            proxy_pass http://172.27.48.233:8001/;
            proxy_set_header Host $host;
            proxy_set_header Authorization "Token 8fd77834b1412f49a09e768be1b379f5416f33c3";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
